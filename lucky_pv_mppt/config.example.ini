# Copy to config.ini (or ~/.config/solar-mppt/config.ini) and fill in.
# Holds broker passwords, so: chmod 600 config.ini
# config.ini is gitignored; this example file is not, so keep real
# credentials, serials and topics out of it.

[device]
# The hex string from your MQTT topic -- the controller's serial. Home
# Assistant keys the device and every entity's unique_id on this, so changing
# it after setup orphans the entities and their history.
serial = AABBCCDDEEFF
# The wifi module id, the segment before the serial in the topic.
module_id = wifiXXXXXXXX
# Device name shown in Home Assistant.
name = Lucky PV MPPT

# The vendor's broker -- where the controller reports.
[source]
host = broker.example.com
port = 1883
username =
password =
# {serial} and {module_id} come from [device]. A literal topic works too.
topic = jgy/{module_id}/{serial}/device_state
# client_id defaults to solar-mppt-<serial>
client_id =
keepalive = 60

# Your own broker -- the one Home Assistant's MQTT integration is connected to.
# Usually a local Mosquitto, not the vendor's.
[homeassistant]
enabled = true
host = 192.168.1.10
port = 1883
username =
password =
client_id =
keepalive = 60
# Must match the MQTT integration's discovery prefix. 'homeassistant' unless
# you changed it.
discovery_prefix = homeassistant
state_topic = solar-mppt/{serial}/state
availability_topic = solar-mppt/{serial}/availability
# Retain the state so HA restores the last reading immediately on restart
# rather than waiting for the controller's next report, which overnight can be
# a long time.
retain = true

# Optional. Pins entity_ids instead of letting HA derive them from the device
# and sensor names -- use this to match entity_ids an earlier setup already
# used, so dashboards and automations keep working.
# Valid keys: pv_voltage, battery_voltage, charge_current, charge_power,
#             temperature, energy_today, energy_total
[entity_ids]
# charge_power = solarinverterwatts
# energy_today = solarinverterdailywatts

[daemon]
log_level = INFO
# Leave blank to log to stdout. Required for --background.
log_file =
pid_file =
