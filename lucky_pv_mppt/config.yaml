# Home Assistant add-on manifest.
#
# NOTE: this is the *add-on* manifest that the Supervisor reads. It is not the
# application's own config -- that is config.example.ini / config.ini. When
# running as an add-on you configure it in the HA UI and the settings here are
# rendered into a config.ini at startup.

name: Lucky PV MPPT Device
version: "1.0.2"
slug: lucky_pv_mppt
description: >-
  Bridges a JGY / inverteriot MPPT solar charge controller into Home Assistant
  via MQTT Discovery, with an Energy dashboard PV source.
url: https://github.com/PaulTimmins/ha-addons

arch:
  - aarch64
  - amd64
  - armv7

# Long-running service, started by the Supervisor and restarted if it dies.
startup: services
boot: auto
init: false

# Pulls the Mosquitto host/credentials from the Supervisor so they do not have
# to be typed in again. "want" rather than "need" so the add-on still starts if
# you would rather point it at an external broker by hand below.
services:
  - mqtt:want

# Everything except device_serial and source_password is a working default for
# the Lucky PV / inverteriot service -- these values are shared across every
# device of this model, so most people only fill in two fields. They stay
# editable in case the vendor ever changes them.
#
# The two you need:
#   device_serial   -- the hex string unique to your unit (see DOCS.md).
#   source_password -- the vendor broker password. It is the same for every
#                      device. Get it by emailing paul@timmins.net, or sniff it
#                      yourself: it crosses the wire in cleartext to
#                      usadev.inverteriot.com:1883 (MQTT CONNECT packet).
options:
  device_serial: ""
  device_module_id: wifi20220903
  device_name: Lucky PV MPPT
  source_host: usadev.inverteriot.com
  source_port: 1883
  source_username: device_client
  source_password: ""
  source_topic: jgy/{module_id}/{serial}/device_state
  mqtt_host: ""
  mqtt_port: 1883
  mqtt_username: ""
  mqtt_password: ""
  discovery_prefix: homeassistant
  retain: true
  entity_id_charge_power: ""
  entity_id_energy_today: ""
  log_level: info

schema:
  # The hex string from your controller's MQTT topic.
  device_serial: str
  device_module_id: str
  device_name: str

  # The vendor's broker -- where the controller reports.
  source_host: str
  source_port: port
  source_username: str?
  source_password: password?
  source_topic: str

  # Your broker. Leave blank to use the Mosquitto add-on automatically.
  mqtt_host: str?
  mqtt_port: port?
  mqtt_username: str?
  mqtt_password: password?

  discovery_prefix: str?
  retain: bool?

  # Optional: pin entity_ids to match an existing setup.
  entity_id_charge_power: str?
  entity_id_energy_today: str?

  log_level: list(debug|info|warning|error)?
